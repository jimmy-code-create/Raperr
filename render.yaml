services:
  - type: web
    name: nexus
    env: node
    region: oregon
    plan: free
    buildCommand: npm install -g pnpm@10.26.1 --prefix=/tmp/pnpm && export PATH=/tmp/pnpm/bin:$PATH && pnpm install --no-frozen-lockfile && pnpm --filter @workspace/nexus run build && pnpm --filter @workspace/api-server run build
    startCommand: export PATH=/tmp/pnpm/bin:$PATH && pnpm --filter @workspace/db run push-force && node artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        sync: false